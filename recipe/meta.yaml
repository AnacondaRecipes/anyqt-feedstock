{% set name = "AnyQt" %}
{% set version = "0.2.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: ca1cc824bcb517dab8a5d674fab9f94182fb9e3e51216d772b8a66b82efbd2ca
  patches:  # [osx]
    - patches/0001-patch-osx-path.patch  # [osx]

build:
  number: 0
  skip: true  # [py<36]
  script: {{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
    - pyqt {{ pyqt }}
  run:
    - python
    - pyqt

test:
  source_files:
    - tests
  imports:
    - AnyQt.QtCore
    - AnyQt.QtGui
    - AnyQt.QtWidgets
    - AnyQt.QtNetwork
    - AnyQt.QtSvg
  requires:
    - pip
    - pytest
  commands:
    - pip check
    # Fatal Python error: Aborted for Linux
    - pytest -vv tests  # [not linux]

about:
  home: https://github.com/ales-erjavec/anyqt
  license: GPL-3.0-or-later
  license_family: GPL3
  license_file: LICENSE.txt
  summary: PyQt4/PyQt5 compatibility layer.
  description: |
    AnyQt exports a Qt5 compatible module namespace along with minimal renames
    to support portability between versions and provides an optional compatibility import hook.
  doc_url: https://anyqt.readthedocs.io/en/stable
  dev_url: https://github.com/ales-erjavec/anyqt

extra:
  recipe-maintainers:
    - ales-erjavec
    - astaric
